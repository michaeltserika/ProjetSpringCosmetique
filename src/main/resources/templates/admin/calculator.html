<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Calculateur - ShopFandresena</title>
	<style>
		.calculator-container {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 70vh;
			padding: 20px;
		}
		.calculator-body {
			width: 320px;
			background:#2c3e50;
			border-radius:15px;
			padding:20px;
			box-shadow:0 8px 25px rgba(0,0,0,0.3);
			margin: 0 auto;
		}
		.calculator-screen {
			background:#111;
			color:#0f0;
			font-family:'Courier New', monospace;
			font-size:28px;
			text-align:right;
			padding:15px;
			border-radius:8px;
			margin-bottom:15px;
			overflow:hidden;
			min-height: 50px;
			display: flex;
			align-items: center;
			justify-content: flex-end;
		}
		.calculator-buttons {
			display:grid;
			grid-template-columns: repeat(4,1fr);
			gap:10px;
		}
		.calc-btn {
			padding:18px 0;
			font-size:18px;
			border:none;
			border-radius:8px;
			cursor:pointer;
			color:#fff;
			background:#34495e;
			transition:0.2s;
			font-weight: bold;
		}
		.calc-btn:hover {
			background:#3d566e;
			transform: translateY(-2px);
		}
		.calc-btn:active {
			transform: translateY(0);
		}
		.operator-btn {
			background:#e74c3c;
		}
		.operator-btn:hover {
			background:#ec7063;
		}
		.equals-btn {
			background:#27ae60;
		}
		.equals-btn:hover {
			background:#58d68d;
		}
		.function-btn {
			background:#95a5a6;
			color:#2c3e50;
		}
		.zero-btn {
			grid-column: span 2;
		}
	</style>
</head>

<body th:replace="~{base::layout(~{::section})}">
<section>
	<div class="calculator-container">
		<div class="calculator-body">
			<div id="calculatorDisplay" class="calculator-screen">0</div>
			<div class="calculator-buttons">
				<button class="calc-btn function-btn" onclick="clearAll()">AC</button>
				<button class="calc-btn function-btn" onclick="toggleSign()">±</button>
				<button class="calc-btn operator-btn" onclick="setOperation('/')">÷</button>
				<button class="calc-btn operator-btn" onclick="setOperation('*')">×</button>

				<button class="calc-btn" onclick="appendNumber('7')">7</button>
				<button class="calc-btn" onclick="appendNumber('8')">8</button>
				<button class="calc-btn" onclick="appendNumber('9')">9</button>
				<button class="calc-btn operator-btn" onclick="setOperation('-')">−</button>

				<button class="calc-btn" onclick="appendNumber('4')">4</button>
				<button class="calc-btn" onclick="appendNumber('5')">5</button>
				<button class="calc-btn" onclick="appendNumber('6')">6</button>
				<button class="calc-btn operator-btn" onclick="setOperation('+')">+</button>

				<button class="calc-btn" onclick="appendNumber('1')">1</button>
				<button class="calc-btn" onclick="appendNumber('2')">2</button>
				<button class="calc-btn" onclick="appendNumber('3')">3</button>
				<button class="calc-btn equals-btn" onclick="calculateResult()">=</button>

				<button class="calc-btn zero-btn" onclick="appendNumber('0')">0</button>
				<button class="calc-btn" onclick="appendDecimal()">.</button>
			</div>
		</div>
	</div>
</section>

<script>
let displayValue='0', firstOperand=null, waitingForSecondOperand=false, operator=null;

function updateDisplay(){ document.getElementById('calculatorDisplay').textContent = displayValue; }

function appendNumber(num){ displayValue=waitingForSecondOperand ? num : displayValue==='0'?num:displayValue+num; waitingForSecondOperand=false; updateDisplay(); }

function appendDecimal(){ if(waitingForSecondOperand){ displayValue='0.'; waitingForSecondOperand=false; } else if(!displayValue.includes('.')) displayValue+='.'; updateDisplay(); }

function setOperation(nextOp){
    const input=parseFloat(displayValue);
    if(firstOperand===null) firstOperand=input;
    else if(operator){ firstOperand=calculate(firstOperand,input,operator); displayValue=String(firstOperand); }
    operator=nextOp; waitingForSecondOperand=true; updateDisplay();
}

function calculate(a,b,op){ switch(op){ case '+': return a+b; case '-': return a-b; case '*': return a*b; case '/': return a/b; default: return b; } }

function calculateResult(){ if(firstOperand!==null && operator){ displayValue=String(calculate(firstOperand,parseFloat(displayValue),operator)); firstOperand=null; operator=null; waitingForSecondOperand=false; updateDisplay(); } }

function clearAll(){ displayValue='0'; firstOperand=null; operator=null; waitingForSecondOperand=false; updateDisplay(); }

function toggleSign(){ displayValue=(parseFloat(displayValue)*-1).toString(); updateDisplay(); }

function handleKeyboard(e){
    if(e.key>='0' && e.key<='9') appendNumber(e.key);
    else if(e.key==='.') appendDecimal();
    else if(e.key==='+'||e.key==='-'||e.key==='*'||e.key==='/') setOperation(e.key);
    else if(e.key==='Enter') calculateResult();
    else if(e.key==='Backspace') displayValue=displayValue.slice(0,-1)||'0',updateDisplay();
    else if(e.key==='c' || e.key==='C') clearAll();
    else if(e.key==='s' || e.key==='S') toggleSign();
}

document.addEventListener('keydown', handleKeyboard);
updateDisplay();
</script>
</body>
</html>
