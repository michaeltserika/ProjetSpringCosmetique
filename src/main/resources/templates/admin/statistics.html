<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Statistiques - ShopFandresena</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body th:replace="~{base::layout(~{::section})}">
<section>
    <!-- === TON CONTENU (identique à ce que tu avais) === -->
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <h2 class="text-center mb-4">Tableau de Bord Statistiques</h2>
            </div>
        </div>

        <!-- Cartes statistiques -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card modern-card gradient-primary text-white shadow-lg">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-shopping-cart fa-3x mb-3"></i>
                        <h5 class="fw-bold">Total Commandes</h5>
                        <h2 id="totalOrders" th:text="${totalOrders}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card modern-card gradient-success text-white shadow-lg">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-box fa-3x mb-3"></i>
                        <h5 class="fw-bold">Total Produits</h5>
                        <h2 id="totalProducts" th:text="${totalProducts}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card modern-card gradient-warning text-white shadow-lg">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-users fa-3x mb-3"></i>
                        <h5 class="fw-bold">Total Utilisateurs</h5>
                        <h2 id="totalUsers" th:text="${totalUsers}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card modern-card gradient-info text-white shadow-lg">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-tags fa-3x mb-3"></i>
                        <h5 class="fw-bold">Total Catégories</h5>
                        <h2 id="totalCategories" th:text="${totalCategories}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Graphiques principaux -->
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white">
                        <h5><i class="fa-solid fa-chart-pie me-2"></i>Répartition des Commandes</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="ordersChart" style="min-height:300px;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-success text-white">
                        <h5><i class="fa-solid fa-chart-bar me-2"></i>Produits par Catégorie</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="categoriesChart" style="min-height:300px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Derniers graphiques -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-warning">
                        <h5><i class="fa-solid fa-chart-line me-2"></i>Évolution 30 derniers jours</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="ordersTrendChart" style="min-height:300px;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fa-solid fa-trophy me-2"></i>Top 5 Produits</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="topProductsChart" style="min-height:300px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- === SCRIPT ENTIER QUI AFFICHE LES 4 GRAPHIQUES === -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    fetch('/admin/api/statistics')
        .then(res => res.json())
        .then(data => {
            
            // === COULEURS ===
            const chartColors = {
                primary: '#007bff',
                green: '#28a745',
                blue: '#17a2b8',
                red: '#dc3545',
                yellow: '#ffc107'
            };

            // === 1) Camembert des commandes ===
            new Chart(document.getElementById('ordersChart'), {
                type: 'doughnut',
                data: {
                    labels: ['En attente', 'En cours', 'Livré', 'Annulé'],
                    datasets: [{
                        data: [
                            data.pendingOrders || 0,
                            data.processingOrders || 0,
                            data.deliveredOrders || 0,
                            data.cancelledOrders || 0
                        ],
                        backgroundColor: [chartColors.yellow, chartColors.blue, chartColors.green, chartColors.red]
                    }]
                }
            });

            // === 2) Barres catégories ===
            new Chart(document.getElementById('categoriesChart'), {
                type: 'bar',
                data: {
                    labels: data.categoryNames || [],
                    datasets: [{
                        label: 'Nombre de produits',
                        data: data.categoryCounts || [],
                        backgroundColor: chartColors.primary
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // === 3) Ligne des 30 derniers jours ===
            new Chart(document.getElementById('ordersTrendChart'), {
                type: 'line',
                data: {
                    labels: data.last30Days || [],
                    datasets: [{
                        label: 'Commandes',
                        data: data.ordersPerDay || [],
                        borderColor: chartColors.green,
                        fill: true,
                        tension: 0.4
                    }]
                }
            });

            // === 4) Top produits ===
            new Chart(document.getElementById('topProductsChart'), {
                type: 'bar',
                data: {
                    labels: data.topProductNames || [],
                    datasets: [{
                        label: 'Ventes',
                        data: data.topProductSales || [],
                        backgroundColor: chartColors.yellow
                    }]
                },
                options: { indexAxis: 'y' }
            });
        })
        .catch(err => console.error("Erreur chargement API :", err));
});
</script>

</body>
</html>
